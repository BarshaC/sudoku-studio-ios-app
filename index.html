<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku Studio</title>
<style>
  :root { color-scheme: light dark; }
  body {
    max-width: 34rem;
    margin: 0 auto;
    padding: 5rem 1.25rem 6rem;
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #1b1d22;
    background: #fff;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e6e8ee; background: #14161a; }
    a.card { border-color: #2c313b; }
    a.card:hover { border-color: #3f4655; }
    .grid rect { stroke: #3f4655; }
  }
  h1 { font-size: 2rem; letter-spacing: -.02em; margin: 1.25rem 0 .3rem; }
  .tagline { color: #6b7280; margin: 0 0 3rem; }
  .links { display: flex; flex-direction: column; gap: .75rem; }
  a.card {
    display: block;
    border: 1px solid #dcdfe5;
    border-radius: 8px;
    padding: .9rem 1.1rem;
    text-decoration: none;
    color: inherit;
    transition: border-color .15s ease;
  }
  a.card:hover { border-color: #9aa1ae; }
  a.card strong { display: block; font-size: 1rem; }
  a.card span { color: #6b7280; font-size: .9rem; }
  footer { margin-top: 4rem; color: #6b7280; font-size: .85rem; }
  footer a { color: inherit; }
</style>
</head>
<body>

<svg class="grid" width="72" height="72" viewBox="0 0 72 72" aria-hidden="true">
  <g fill="none" stroke="#c8ccd4" stroke-width="2">
    <rect x="3"  y="3"  width="20" height="20" rx="3"/>
    <rect x="26" y="3"  width="20" height="20" rx="3"/>
    <rect x="49" y="3"  width="20" height="20" rx="3"/>
    <rect x="3"  y="26" width="20" height="20" rx="3"/>
    <rect x="26" y="26" width="20" height="20" rx="3" fill="#d9c5ab" stroke="#b08a55"/>
    <rect x="49" y="26" width="20" height="20" rx="3"/>
    <rect x="3"  y="49" width="20" height="20" rx="3"/>
    <rect x="26" y="49" width="20" height="20" rx="3"/>
    <rect x="49" y="49" width="20" height="20" rx="3"/>
  </g>
</svg>

<h1>Sudoku Studio</h1>
<p class="tagline">A sudoku game for iPhone.</p>

<div class="links">
  <a class="card" href="support.html">
    <strong>Support</strong>
    <span>Help, bug reports, and how to get in touch</span>
  </a>
  <a class="card" href="privacy.html">
    <strong>Privacy Policy</strong>
    <span>What the app collects, and how to remove it</span>
  </a>
</div>

<footer>
  <a href="mailto:support@sudokustudiogame.com">support@sudokustudiogame.com</a>
</footer>

</body>
</html>
